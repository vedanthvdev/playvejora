app = "playvejora"
primary_region = "lhr"

[build]

[env]
  PORT = "3000"
  SITE_URL = "https://playvejora.dpdns.org"
  PLAYVEJORA_DB_PATH = "/data/playvejora.sqlite"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # SQLite lives on a volume that a second machine cannot share, so the
  # league must stay on one machine until the data moves to a real database.
  min_machines_running = 0
  max_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/version.info"

[mounts]
  source = "playvejora_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
