name: deploy

# GitHub ignores events created with the automatic GITHUB_TOKEN, so the tag the
# `version` job pushes cannot start a run here. `version` calls this workflow
# instead once the bump is tagged. workflow_dispatch ships whatever master
# holds right now, which is also how a missed release is recovered.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  production:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          # `version` has just pushed the bump, so deploy master rather than the
          # merge commit that started the calling run.
          ref: master
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
            exit 1
          fi
      - run: npm ci
      - run: npx wrangler d1 migrations apply playvejora --remote
      - run: npm run deploy
      - name: Report the deployed version
        run: curl -sS https://playvejora.playvejora.workers.dev/version.info
