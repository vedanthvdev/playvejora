name: deploy

# A merge to master first runs `version`, which tags vX.Y.Z. This job then
# applies pending D1 migrations and publishes the Worker so /version.info
# matches the tag. workflow_dispatch covers a missed release or a first run
# after the Cloudflare secrets are added.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  production:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
            exit 1
          fi
      - run: npm ci
      - run: npx wrangler d1 migrations apply playvejora --remote
      - run: npm run deploy
